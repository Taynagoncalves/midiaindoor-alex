<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pit Stop Lanches - Painel de Mídia Indoor</title>
  <!-- tira o zoom no toque, o painel fica ligado sozinho na tv -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- os slides entram aqui dentro, o script.js que monta tudo -->
  <div id="palco">
  </div>

  <!-- logo fixa no canto, aparece em cima de qualquer slide -->
  <img id="logo-marca" src="" alt="Logo Pit Stop Lanches">

  <!-- bolinhas mostrando em qual slide tá -->
  <div id="indicadores"></div>

  <!-- pede pra ativar tela cheia, some sozinho depois de um tempo -->
  <div id="aviso-fullscreen">
    Toque na tela ou pressione F11 para ativar o modo tela cheia
  </div>

  <script src="script.js"></script>
</body>
</html>
